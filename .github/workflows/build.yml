name: Build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        uses: geode-sdk/build-geode-mod@main
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/*.geode
