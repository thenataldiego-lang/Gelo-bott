name: Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: truename: Build
on: [push]
jobs:
